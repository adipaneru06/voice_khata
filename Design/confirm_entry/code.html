<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#131313;}body{overscroll-behavior:none;font-family:'Inter',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-highest": "#353534", "surface-container-high": "#2a2a2a", "secondary-fixed-dim": "#c7c6c6", "primary-container": "#e2e2e2", "surface-container-low": "#1c1b1b", "secondary": "#c7c6c6", "inverse-surface": "#e5e2e1", "surface-bright": "#3a3939", "tertiary": "#ffffff", "on-secondary-fixed-variant": "#464747", "on-surface-variant": "#c4c7c8", "on-background": "#e5e2e1", "surface": "#131313", "on-primary-fixed": "#1a1c1c", "surface-tint": "#c6c6c7", "tertiary-fixed-dim": "#c8c6c5", "on-primary-fixed-variant": "#454747", "inverse-on-surface": "#313030", "on-secondary-container": "#b5b5b5", "primary-fixed": "#e2e2e2", "primary-fixed-dim": "#c6c6c7", "surface-container": "#201f1f", "background": "#131313", "on-tertiary-fixed-variant": "#474746", "surface-variant": "#353534", "surface-container-lowest": "#0e0e0e", "on-tertiary": "#303030", "tertiary-fixed": "#e4e2e1", "surface-dim": "#131313", "on-error-container": "#ffdad6", "on-surface": "#e5e2e1", "on-secondary-fixed": "#1b1c1c", "error": "#ffb4ab", "outline": "#8e9192", "on-primary-container": "#636565", "outline-variant": "#444748", "on-error": "#690005", "on-tertiary-fixed": "#1b1c1c", "secondary-fixed": "#e3e2e2", "tertiary-container": "#e4e2e1", "error-container": "#93000a", "on-tertiary-container": "#656464", "on-primary": "#2f3131", "primary": "#ffffff", "inverse-primary": "#5d5f5f", "secondary-container": "#464747", "on-secondary": "#303031" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "0.75rem", "space-lg": "1rem", "margin-desktop": "1.5rem", "gutter-desktop": "1rem", "space-xs": "0.25rem", "margin": "0.75rem", "space-xl": "1.5rem", "gutter": "0.5rem", "space-sm": "0.5rem" }, "fontFamily": { "headline-sm": ["Inter"], "headline-lg": ["Inter"], "label-md": ["Inter"], "label-lg": ["Inter"], "currency-md": ["Inter"], "currency-lg": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"], "body-sm": ["Inter"] }, "fontSize": { "headline-sm": ["15px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "500" }], "label-md": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-lg": ["13px", { "lineHeight": "16px", "letterSpacing": "0", "fontWeight": "500" }], "currency-md": ["14px", { "lineHeight": "18px", "letterSpacing": "0", "fontWeight": "500" }], "currency-lg": ["20px", { "lineHeight": "24px", "letterSpacing": "-0.02em", "fontWeight": "500" }], "body-lg": ["15px", { "lineHeight": "22px", "letterSpacing": "0", "fontWeight": "400" }], "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.015em", "fontWeight": "500" }], "body-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0", "fontWeight": "400" }], "label-sm": ["10px", { "lineHeight": "12px", "letterSpacing": "0.04em", "fontWeight": "500" }], "body-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col selection:bg-surface-container-highest"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="w-11 h-11 -ml-space-xs flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight truncate">Confirm Entry</h1></div><div class="flex items-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 px-margin pb-safe bg-surface"><div class="flex flex-col w-full pb-28">
<div class="flex flex-col gap-y-6 pt-2">
<!-- Audio Transcript Card -->
<section aria-labelledby="transcript-label" class="flex flex-col gap-y-2">
<span class="text-on-surface-variant font-label-md text-label-md uppercase tracking-wider" id="transcript-label">Audio transcript</span>
<div class="p-space-lg bg-surface-container-low border border-surface-container-high rounded-lg flex items-start gap-space-md">
<span class="material-symbols-outlined text-on-surface-variant text-[20px] shrink-0 mt-0.5">graphic_eq</span>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
          “Sharma ji ko 5 kilo chawal, 600 rupaye, udhaar”
        </p>
</div>
</section>
<!-- Parsed Fields Form -->
<form class="flex flex-col gap-y-4" id="ledger-confirm-form" onsubmit="event.preventDefault();">
<!-- Customer Field -->
<div class="flex flex-col gap-y-1.5">
<label class="text-on-surface-variant font-label-md text-label-md" for="field-customer">Customer</label>
<div class="relative flex items-center">
<input class="w-full h-11 px-3 bg-surface-container-low border border-surface-container-high rounded-lg font-body-lg text-body-lg text-on-surface focus:border-outline focus:outline-none transition-colors" id="field-customer" type="text" value="Sharma ji"/>
</div>
</div>
<!-- Item Field -->
<div class="flex flex-col gap-y-1.5">
<label class="text-on-surface-variant font-label-md text-label-md" for="field-item">Item</label>
<input class="w-full h-11 px-3 bg-surface-container-low border border-surface-container-high rounded-lg font-body-lg text-body-lg text-on-surface focus:border-outline focus:outline-none transition-colors" id="field-item" type="text" value="Chawal (Rice)"/>
</div>
<!-- Quantity & Unit Grid -->
<div class="grid grid-cols-2 gap-space-md">
<div class="flex flex-col gap-y-1.5">
<label class="text-on-surface-variant font-label-md text-label-md" for="field-qty">Quantity</label>
<input class="w-full h-11 px-3 bg-surface-container-low border border-surface-container-high rounded-lg font-body-lg text-body-lg text-on-surface focus:border-outline focus:outline-none tabular-nums transition-colors" id="field-qty" inputmode="decimal" type="text" value="5"/>
</div>
<div class="flex flex-col gap-y-1.5">
<label class="text-on-surface-variant font-label-md text-label-md" for="field-unit">Unit</label>
<input class="w-full h-11 px-3 bg-surface-container-low border border-surface-container-high rounded-lg font-body-lg text-body-lg text-on-surface focus:border-outline focus:outline-none transition-colors" id="field-unit" type="text" value="kg"/>
</div>
</div>
<!-- Amount Field: Missing State -->
<div class="flex flex-col gap-y-1.5">
<div class="flex justify-between items-center">
<label class="text-on-surface-variant font-label-md text-label-md" for="field-amount">Amount (₹)</label>
<span class="text-[10px] font-label-sm uppercase tracking-wider text-error">Required</span>
</div>
<div class="relative flex items-center">
<span class="absolute left-3 text-on-surface-variant font-currency-md text-currency-md select-none">₹</span>
<input class="w-full h-11 pl-7 pr-3 bg-surface-container-low border border-error rounded-lg font-currency-md text-currency-md text-on-surface placeholder:text-on-surface-variant/40 focus:border-outline focus:outline-none tabular-nums transition-colors" id="field-amount" inputmode="numeric" placeholder="0" step="any" type="number"/>
</div>
<p class="text-error font-label-md text-label-md flex items-center gap-1 mt-0.5" id="amount-validation-msg">
<span class="material-symbols-outlined text-[14px]">error</span>
<span>Amount not found. Please enter it.</span>
</p>
</div>
<!-- Transaction Type Segmented Control -->
<div class="flex flex-col gap-y-1.5 pt-1">
<label class="text-on-surface-variant font-label-md text-label-md">Type</label>
<div aria-label="Transaction Type" class="h-11 p-1 bg-surface-container-low border border-surface-container-high rounded-lg grid grid-cols-3 gap-1 select-none" role="radiogroup">
<button aria-checked="true" class="h-full rounded flex items-center justify-center font-label-lg text-label-lg transition-colors bg-primary text-on-primary font-medium" id="type-udhaar" onclick="setTransactionType('udhaar')" role="radio" type="button">
            Udhaar
          </button>
<button aria-checked="false" class="h-full rounded flex items-center justify-center font-label-lg text-label-lg transition-colors bg-transparent text-on-surface-variant hover:text-on-surface" id="type-cash" onclick="setTransactionType('cash')" role="radio" type="button">
            Cash
          </button>
<button aria-checked="false" class="h-full rounded flex items-center justify-center font-label-lg text-label-lg transition-colors bg-transparent text-on-surface-variant hover:text-on-surface" id="type-received" onclick="setTransactionType('received')" role="radio" type="button">
            Payment rec.
          </button>
</div>
</div>
</form>
</div>
<!-- Persistent Sticky Bottom Action Deck -->
<div class="fixed bottom-0 inset-x-0 bg-surface border-t border-surface-container-high p-4 z-40 pb-safe">
<div class="max-w-md mx-auto grid grid-cols-2 gap-space-md">
<button class="h-11 rounded-lg bg-surface-container-low border border-surface-container-high text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-1.5 active:bg-surface-container-high transition-colors" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[18px]">mic</span>
        Re-record
      </button>
<button class="h-11 rounded-lg bg-surface-container border border-surface-container-high text-on-surface-variant/40 font-label-lg text-label-lg flex items-center justify-center gap-1.5 cursor-not-allowed transition-colors select-none" disabled="" id="save-entry-btn" type="button">
<span class="material-symbols-outlined text-[18px]">check</span>
        Save entry
      </button>
</div>
</div>
</div>
<script>
  function setTransactionType(type) {
    const types = ['udhaar', 'cash', 'received'];
    types.forEach(t => {
      const btn = document.getElementById(`type-${t}`);
      if (t === type) {
        btn.setAttribute('aria-checked', 'true');
        btn.className = "h-full rounded flex items-center justify-center font-label-lg text-label-lg transition-colors bg-primary text-on-primary font-medium";
      } else {
        btn.setAttribute('aria-checked', 'false');
        btn.className = "h-full rounded flex items-center justify-center font-label-lg text-label-lg transition-colors bg-transparent text-on-surface-variant hover:text-on-surface";
      }
    });
  }

  const amountInput = document.getElementById('field-amount');
  const saveBtn = document.getElementById('save-entry-btn');
  const errorMsg = document.getElementById('amount-validation-msg');

  amountInput.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    const isValid = !isNaN(val) && val > 0;

    if (isValid) {
      amountInput.classList.remove('border-error');
      amountInput.classList.add('border-surface-container-high');
      errorMsg.classList.add('hidden');
      
      saveBtn.removeAttribute('disabled');
      saveBtn.classList.remove('cursor-not-allowed', 'bg-surface-container', 'text-on-surface-variant/40');
      saveBtn.classList.add('bg-primary', 'text-on-primary', 'border-transparent', 'active:opacity-90');
    } else {
      amountInput.classList.add('border-error');
      amountInput.classList.remove('border-surface-container-high');
      errorMsg.classList.remove('hidden');

      saveBtn.setAttribute('disabled', 'true');
      saveBtn.classList.add('cursor-not-allowed', 'bg-surface-container', 'text-on-surface-variant/40');
      saveBtn.classList.remove('bg-primary', 'text-on-primary', 'border-transparent', 'active:opacity-90');
    }
  });
</script></main></body></html>
